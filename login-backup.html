<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* 登录框 */
        .login-box {
            width: 380px;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        /* 登录按钮 */
        .login-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #555;
        }

        /* 项目介绍按钮 */
        .intro-button {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background: white;
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }

        .intro-button:hover {
            background: #f0f0f0;
        }

        /* 弹窗背景 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);

            justify-content: center;
            align-items: center;
        }

        /* 弹窗内容 */
        .modal-content {
            position: relative;
            width: 90%;
            max-width: 600px;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content p {
            line-height: 1.8;
            color: #444;
        }

        .modal-content h3 {
            margin-top: 25px;
        }

        .modal-content ul {
            line-height: 2;
            color: #444;
        }

        /* 关闭按钮 */
        .close-button {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            color: #888;
            cursor: pointer;
        }

        .close-button:hover {
            color: #333;
        }

        /* 弹窗底部关闭按钮 */
        .modal-close-button {
            display: block;
            margin: 25px auto 0;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .modal-close-button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <!-- 登录框 -->
    <div class="login-box">

        <h1>用户登录</h1>

        <form id="loginForm">

            <div class="form-group">
                <label>用户名</label>
                <input
                    type="text"
                    id="username"
                    placeholder="请输入用户名"
                    required
                >
            </div>

            <div class="form-group">
                <label>密码</label>
                <input
                    type="password"
                    id="password"
                    placeholder="请输入密码"
                    required
                >
            </div>

            <button class="login-button" type="submit">
                登录
            </button>

        </form>

        <!-- 项目介绍按钮 -->
        <button class="intro-button" type="button" id="openIntro">
            查看项目介绍
        </button>

        <p style="text-align: center; margin-top: 20px;">
            还没有账号？
            <a href="register.html">立即注册</a>
        </p>

    </div>


    <!-- 项目介绍弹窗 -->
    <div class="modal" id="introModal">

        <div class="modal-content">

            <!-- 右上角关闭 -->
            <span class="close-button" id="closeIntro">
                &times;
            </span>

            <h2>项目介绍</h2>

            <p>
                <strong>个人电子设备生命周期管理及状态分析系统</strong>
                是一款面向个人用户的电子设备综合管理平台。
            </p>

            <p>
                项目旨在解决用户拥有多种电子设备后，
                设备信息、购买记录、维修记录、升级记录以及使用成本分散管理的问题。
            </p>

            <p>
                系统通过统一记录电子设备从
                <strong>购买、使用、升级、维修到转售或报废</strong>
                的完整生命周期，并利用积累的数据对设备的当前状态和使用成本进行分析。
            </p>

            <h3>主要功能</h3>

            <ul>
                <li>个人电子设备信息管理</li>
                <li>设备生命周期记录</li>
                <li>维修及升级历史管理</li>
                <li>设备使用成本分析</li>
                <li>Dashboard 设备状态与费用展示</li>
            </ul>

            <button class="modal-close-button" id="modalCloseButton">
                关闭
            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        /* =========================
           登录功能
           ========================= */

        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            // 阻止浏览器默认提交表单
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {

                const response = await fetch(
                    "http://localhost:8080/api/users/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                const result = await response.json();

                console.log("后端返回：", result);

                if (result.code === 200) {

                    alert("登录成功！");

                    // 保存用户 ID
                    localStorage.setItem(
                        "userId",
                        result.data.userId
                    );

                } else {

                    alert(result.message || "登录失败");

                }

            } catch (error) {

                console.error("连接后端失败：", error);

                alert(
                    "无法连接后端，请确认后端服务器已经启动。"
                );
            }

        });


        /* =========================
           项目介绍弹窗
           ========================= */

        const introModal = document.getElementById("introModal");

        const openIntro = document.getElementById("openIntro");

        const closeIntro = document.getElementById("closeIntro");

        const modalCloseButton =
            document.getElementById("modalCloseButton");


        // 点击“查看项目介绍”
        openIntro.addEventListener("click", function() {

            introModal.style.display = "flex";

        });


        // 点击右上角 ×
        closeIntro.addEventListener("click", function() {

            introModal.style.display = "none";

        });


        // 点击“关闭”
        modalCloseButton.addEventListener("click", function() {

            introModal.style.display = "none";

        });


        // 点击弹窗外部区域关闭
        introModal.addEventListener("click", function(event) {

            if (event.target === introModal) {

                introModal.style.display = "none";

            }

        });

    </script>

</body>
</html>
